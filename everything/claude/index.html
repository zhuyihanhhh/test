<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude · 一分钟自我介绍</title>
<style>
  html, body { margin: 0; height: 100%; background: #e9e5da; overflow: hidden; }
  body { display: grid; place-items: center; font-family: "Noto Serif SC", "Songti SC", Georgia, serif; }
  canvas { display: block; width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); box-shadow: 0 30px 80px rgba(60,40,20,.12); }
  #ui { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(243,240,232,.62); backdrop-filter: blur(10px); transition: opacity .6s; }
  #ui.hide { opacity: 0; pointer-events: none; }
  .card { text-align: center; color: #1f1e1c; }
  .card h1 { margin: 0 0 10px; font-weight: 500; font-size: 34px; }
  .card h1 i { display: inline-block; width: 9px; height: 9px; margin-left: 4px; border-radius: 50%; background: #d97757; }
  .card h2 { margin: 0 0 36px; font-weight: 400; font-style: italic; font-size: 16px; color: #77736a; }
  .card button { font-family: inherit; font-size: 15px; padding: 13px 28px; margin: 0 6px; border-radius: 999px; cursor: pointer; color: #1f1e1c; background: transparent; border: 1px solid rgba(31,30,28,.22); transition: all .25s; }
  .card button:hover { border-color: #d97757; color: #bd5d3a; }
  .card button.primary { background: #d97757; border-color: #d97757; color: #fff; }
  .card button.primary:hover { background: #bd5d3a; color: #fff; }
  .card p { margin: 28px 0 0; font-size: 13px; color: rgba(31,30,28,.42); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="ui">
  <div class="card">
    <h1>Claude<i></i></h1>
    <h2>一分钟的自我介绍 · 由一个 HTML 文件实时生成</h2>
    <button class="primary" id="play">播放</button>
    <button id="rec">播放并录制 WebM</button>
    <p>空格 暂停 / 继续 · F 全屏 · 录制时请保持本标签页在前台</p>
  </div>
</div>
<script>
'use strict';
/* ============================================================
 *  Claude — sixty seconds.
 *  One file. No assets. Canvas 2D + Web Audio.
 *  Every frame is a pure function of time: render(t).
 * ============================================================ */

const W = 1920, H = 1080, DUR = 60, FPS = 30, BEAT = 60 / 72;
const cv = document.getElementById('stage');
const g = cv.getContext('2d');
cv.width = W; cv.height = H;

const C = { paper: '#f3f0e8', ink: '#1f1e1c', mute: '#77736a', clay: '#d97757', deep: '#bd5d3a', kraft: '#d4a27f', sage: '#8f9e7e', blue: '#4f7896' };
const inkA = a => `rgba(31,30,28,${a})`;
const clayA = a => `rgba(217,119,87,${a})`;
const SERIF = '"Tiempos Headline","Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,serif';
const MONO = '"JetBrains Mono","Cascadia Code","SF Mono",Consolas,monospace';

/* ---------- math ---------- */
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const fade = (t, a, b, fi = .6, fo = .6) => Math.min(prog(t, a, a + fi), 1 - prog(t, b - fo, b));
const ease = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outBack: x => x <= 0 ? 0 : 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2),
};
const hash = (s, k) => { const x = Math.sin(s * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };

function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const perm = new Uint8Array(512);
{ const r = rng(7), p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; }
const smooth5 = t => t * t * t * (t * (t * 6 - 15) + 10);
const grad = (h, x, y) => (h & 1 ? -x : x) + (h & 2 ? -y : y);
function noise(x, y) {
  const fx = Math.floor(x), fy = Math.floor(y), X = fx & 255, Y = fy & 255;
  x -= fx; y -= fy;
  const u = smooth5(x), v = smooth5(y), a = perm[X] + Y, b = perm[X + 1] + Y;
  return lerp(lerp(grad(perm[a], x, y), grad(perm[b], x - 1, y), u),
              lerp(grad(perm[a + 1], x, y - 1), grad(perm[b + 1], x - 1, y - 1), u), v);
}

/* ---------- typography ---------- */
function text(str, x, y, o = {}) {
  const { t = 0, at = null, dur = 1.2, size = 40, weight = 400, style = '', family = SERIF, color = C.ink,
          align = 'left', alpha = 1, ls = 0, dot = false } = o;
  if (alpha <= 0) return;
  const p = at === null ? 1 : ease.outExpo(prog(t, at, at + dur));
  if (p <= 0) return;
  g.save();
  g.globalAlpha *= alpha * Math.min(1, p * 1.6);
  g.font = `${style} ${weight} ${size}px ${family}`;
  g.textAlign = align;
  g.textBaseline = 'alphabetic';
  g.letterSpacing = ls + 'px';
  const w = g.measureText(str).width;
  const dy = (1 - p) * size * .45;
  g.fillStyle = color;
  g.fillText(str, x, y + dy);
  if (dot) {
    const end = align === 'center' ? x + w / 2 : align === 'right' ? x : x + w, r = size * .075;
    g.fillStyle = C.clay;
    g.beginPath(); g.arc(end + r * 1.8, y + dy - r, r, 0, TAU); g.fill();
  }
  g.restore();
}

function title(t, at, out, roman, main, sub, x = 150) {
  const a = 1 - prog(t, out, out + .6);
  if (t < at - .2 || a <= 0) return;
  text(roman, x, 726, { t, at: at - .15, size: 24, style: 'italic', color: C.clay, alpha: a });
  text(main, x, 862, { t, at, size: 104, weight: 600, alpha: a, dot: true });
  text(sub, x, 930, { t, at: at + .3, size: 30, color: C.mute, alpha: a, ls: 1 });
}

/* ---------- the spark: an exact polar union of 12 capsules ---------- */
const RAYS = (() => { const r = rng(9); return Array.from({ length: 12 }, (_, k) => ({ th: k * TAU / 12 + (r() - .5) * .14, L: .64 + r() * .36, hw: .066 + r() * .018 })); })();
const R0 = .17;
function sparkR(th, grow) {
  let R = R0;
  for (let k = 0; k < RAYS.length; k++) {
    const ray = RAYS[k], L = ray.L * grow(k);
    if (L <= 0) continue;
    let d = ((th - ray.th) % TAU + TAU) % TAU;
    if (d > Math.PI) d -= TAU;
    const c = Math.cos(d);
    if (c <= 0) continue;
    const s = Math.abs(Math.sin(d)), hw = ray.hw;
    const rk = L * s <= hw ? L * c + Math.sqrt(hw * hw - L * L * s * s) : hw / s;
    if (rk > R) R = rk;
  }
  return R;
}
function drawSpark(cx, cy, sc, rot, grow, color = C.clay, alpha = 1) {
  if (alpha <= 0 || sc <= 0) return;
  g.save();
  g.globalAlpha *= alpha;
  g.fillStyle = color;
  g.beginPath();
  for (let i = 0; i <= 720; i++) {
    const th = i / 720 * TAU, r = sparkR(th, grow) * sc;
    const x = cx + Math.cos(th + rot) * r, y = cy + Math.sin(th + rot) * r;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.fill();
  g.restore();
}
const RAY_T = k => .5 + k * .24;

/* ---------- I · 序  &  II · 你好 ---------- */
function sOpen(t) {
  const a = 1 - prog(t, 12.8, 13.6);
  if (a <= 0) return;
  const m = ease.inOut(prog(t, 5.4, 7));
  const breath = 1 + Math.sin(t * TAU / (BEAT * 4)) * .015;
  drawSpark(W / 2, lerp(H / 2, 330, m), lerp(230, 96, m) * breath, t * .05,
            k => ease.outBack(prog(t, RAY_T(k), RAY_T(k) + .6)), C.clay, a);
}

function sHello(t) {
  const a = 1 - prog(t, 12.6, 13.2);
  if (t < 7.2 || a <= 0) return;
  const full = '你好，我是 Claude';
  text(full, W / 2, 610, { t, at: 7.4, size: 92, weight: 500, align: 'center', alpha: a, dot: true });
  text('Anthropic 训练的 AI 助手', W / 2, 700, { t, at: 8, size: 30, color: C.mute, align: 'center', alpha: a, ls: 2 });
  text('好奇  ·  坦诚  ·  乐于帮忙', W / 2, 770, { t, at: 8.5, size: 22, color: C.clay, align: 'center', alpha: a, ls: 8 });

  const u = ease.inOut(prog(t, 9.2, 10));
  if (u <= 0) return;
  g.save();
  g.font = `500 92px ${SERIF}`;
  const x0 = W / 2 - g.measureText(full).width / 2 + g.measureText('你好，我是 ').width;
  const len = g.measureText('Claude').width;
  g.globalAlpha = a;
  g.strokeStyle = C.clay; g.lineWidth = 5; g.lineCap = 'round';
  g.beginPath();
  for (let i = 0; i <= 60 * u; i++) {
    const x = x0 + len * i / 60, y = 634 + Math.sin(i * .21) * 2.4 + i * .05;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.stroke();
  g.restore();
}

/* ---------- III · 思考 — the spark, rebuilt from 201 rotating circles ---------- */
const FOURIER = (() => {
  const N = 1024, K = 100, pts = [], one = () => 1;
  for (let n = 0; n < N; n++) { const th = n / N * TAU, r = sparkR(th, one); pts.push([Math.cos(th) * r, Math.sin(th) * r]); }
  const terms = [];
  for (let k = -K; k <= K; k++) {
    let re = 0, im = 0;
    for (let n = 0; n < N; n++) {
      const ang = -TAU * k * n / N, c = Math.cos(ang), s = Math.sin(ang);
      re += pts[n][0] * c - pts[n][1] * s;
      im += pts[n][0] * s + pts[n][1] * c;
    }
    terms.push({ k, amp: Math.hypot(re, im) / N, ph: Math.atan2(im, re) });
  }
  terms.sort((p, q) => q.amp - p.amp);
  const at = phi => {
    let x = 0, y = 0;
    for (const c of terms) { x += c.amp * Math.cos(c.k * phi + c.ph); y += c.amp * Math.sin(c.k * phi + c.ph); }
    return [x, y];
  };
  const trail = Array.from({ length: N + 1 }, (_, n) => at(n / N * TAU));
  return { terms, trail, N };
})();

function sThink(t) {
  const a = fade(t, 14, 26, .6, .8);
  if (a <= 0) return;
  const cx = 1200, cy = 440, sc = 270, rot = -Math.PI / 2;
  const phi = TAU * ease.inOut(prog(t, 15.6, 23.4));
  const show = Math.max(1, Math.round(FOURIER.terms.length * ease.outCubic(prog(t, 14.3, 15.6))));
  const P = ([x, y]) => [cx + (x * Math.cos(rot) - y * Math.sin(rot)) * sc, cy + (x * Math.sin(rot) + y * Math.cos(rot)) * sc];

  g.save();
  g.globalAlpha = a;
  const fill = prog(t, 23.3, 24.4);
  if (fill > 0) {
    g.fillStyle = clayA(.92 * fill);
    g.beginPath(); FOURIER.trail.forEach((p, i) => { const [x, y] = P(p); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.fill();
  }
  const n = Math.floor(phi / TAU * FOURIER.N);
  if (n > 0) {
    g.strokeStyle = C.clay; g.lineWidth = 2.6; g.lineJoin = 'round';
    g.beginPath();
    for (let i = 0; i <= n; i++) { const [x, y] = P(FOURIER.trail[i]); i ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke();
  }

  const ca = 1 - prog(t, 23.4, 24.6);
  if (ca > 0) {
    let x = 0, y = 0;
    g.lineWidth = 1;
    for (let i = 0; i < show; i++) {
      const c = FOURIER.terms[i], [px, py] = P([x, y]);
      x += c.amp * Math.cos(c.k * phi + c.ph); y += c.amp * Math.sin(c.k * phi + c.ph);
      const [qx, qy] = P([x, y]);
      if (c.amp * sc > 1.5) { g.strokeStyle = inkA(.13 * ca); g.beginPath(); g.arc(px, py, c.amp * sc, 0, TAU); g.stroke(); }
      g.strokeStyle = inkA(.45 * ca); g.beginPath(); g.moveTo(px, py); g.lineTo(qx, qy); g.stroke();
    }
    const [tx, ty] = P([x, y]);
    g.fillStyle = clayA(ca); g.beginPath(); g.arc(tx, ty, 5, 0, TAU); g.fill();
  }
  g.restore();

  text('z(θ) = Σ cₙ · e^{inθ}', 150, 250, { t, at: 14.6, size: 22, family: MONO, color: C.ink, alpha: a });
  text(`circles   ${String(show).padStart(3, ' ')} / 201`, 150, 300, { size: 17, family: MONO, color: C.mute, alpha: a * prog(t, 14.8, 15.4) });
  text(`samples   1024`, 150, 332, { size: 17, family: MONO, color: C.mute, alpha: a * prog(t, 14.9, 15.5) });
  text(`progress  ${(phi / TAU * 100).toFixed(1).padStart(5, ' ')} %`, 150, 364, { size: 17, family: MONO, color: C.mute, alpha: a * prog(t, 15, 15.6) });
  text('再复杂的形状，也只是许多简单圆周的叠加。', 150, 446, { t, at: 16.4, size: 24, style: 'italic', color: C.mute, alpha: a });

  title(t, 14.6, 25, 'iii.', '我思考', '把复杂的问题拆成简单的部分，一步一步来。');
}

/* ---------- IV · 坦诚 — the frontier between knowing and not knowing ---------- */
const DOTS = (() => {
  const out = [];
  for (let y = 160; y <= 680; y += 34) for (let x = 120; x <= W - 120; x += 34) {
    const i = out.length;
    out.push({ x, y, n: i * .37, q: hash(i, 1) < .07, hot: hash(i, 2) < .06 });
  }
  return out;
})();

function sHonest(t) {
  const a = fade(t, 26, 36, .6, .8);
  if (a <= 0) return;
  const F = 1040 + Math.max(0, t - 28.4) * 7;
  g.save();
  g.globalAlpha = a;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `italic 400 19px ${SERIF}`;
  for (const d of DOTS) {
    const ap = prog(t, 26.2 + d.x / W * 1.6, 26.9 + d.x / W * 1.6);
    if (ap <= 0) continue;
    const q = clamp((d.x - F + 100) / 560), jit = q * q * 24;
    const x = d.x + noise(d.n, t * .45) * jit, y = d.y + noise(d.n + 7, t * .45) * jit;
    const al = lerp(.78, .14, q) * ap;
    if (d.q && q > .5) { g.fillStyle = inkA(al * 2.2); g.fillText('?', x, y); continue; }
    g.fillStyle = d.hot && q < .25 ? clayA(ap) : inkA(al);
    g.beginPath(); g.arc(x, y, lerp(3.1, 1.6, q), 0, TAU); g.fill();
  }
  g.restore();

  const l = ease.inOut(prog(t, 27.6, 28.6));
  if (l > 0) {
    g.save();
    g.globalAlpha = a;
    g.strokeStyle = C.clay; g.lineWidth = 1.5; g.setLineDash([6, 8]);
    g.beginPath(); g.moveTo(F, 128); g.lineTo(F, lerp(128, 712, l)); g.stroke();
    g.restore();
    text('我知道的', F - 22, 116, { t, at: 28.2, size: 22, align: 'right', alpha: a });
    text('我不确定的', F + 22, 116, { t, at: 28.4, size: 22, style: 'italic', color: C.mute, alpha: a });
  }
  title(t, 26.6, 35.2, 'iv.', '我坦诚', '知之为知之，不知为不知。不确定的时候，我会直说。');
}

/* ---------- V · 动手 — the code on the left grows the tree on the right ---------- */
const CODE = `// tree.js — 右边这棵树，正被这段代码种出来
function branch(x, y, len, angle, depth) {
  if (depth === 0) return leaf(x, y);
  const x2 = x + len * Math.cos(angle);
  const y2 = y - len * Math.sin(angle);
  line(x, y, x2, y2, depth);
  const sway = Math.sin(t + depth) * 0.04;
  branch(x2, y2, len * 0.78, angle + 0.33 + sway, depth - 1);
  branch(x2, y2, len * 0.74, angle - 0.29 + sway, depth - 1);
}

branch(1440, 940, 136, Math.PI / 2, 10);`.split('\n');

const KW = /^(function|const|let|if|return|for)$/;
function tokenize(line) {
  const out = [], re = /(\s+)|(\/\/.*)|([A-Za-z_$][\w$]*)|(\d*\.?\d+)|(.)/g;
  let m;
  while ((m = re.exec(line))) {
    const s = m[0];
    const col = m[2] ? '#9a958a' : m[3] ? (KW.test(s) ? C.deep : /^(Math|PI)$/.test(s) ? C.blue : C.ink) : m[4] ? C.blue : '#8d887d';
    out.push([s, col]);
  }
  return out;
}
const TOKENS = CODE.map(tokenize);
const CODE_LEN = CODE.reduce((s, l) => s + l.length + 1, 0);
const LEAF_COLS = [C.clay, C.clay, C.clay, C.kraft, C.deep, C.sage];

function drawTree(t, G, bloom) {
  const leaves = [];
  g.save();
  g.strokeStyle = inkA(.84); g.lineCap = 'round';
  const branch = (x, y, len, angle, depth, level) => {
    if (depth === 0) { leaves.push([x, y]); return; }
    const f = clamp(G - level);
    if (f <= 0) return;
    const x2 = x + len * f * Math.cos(angle), y2 = y - len * f * Math.sin(angle);
    g.lineWidth = depth * .62;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
    if (f < 1) return;
    const sway = Math.sin(t + depth) * .04;
    branch(x2, y2, len * .78, angle + .33 + sway, depth - 1, level + 1);
    branch(x2, y2, len * .74, angle - .29 + sway, depth - 1, level + 1);
  };
  branch(1440, 940, 136, Math.PI / 2, 10, 0);
  leaves.forEach(([x, y], i) => {
    const b = ease.outBack(prog(bloom, hash(i, 4) * .5, hash(i, 4) * .5 + .5));
    if (b <= 0) return;
    let lx = x, ly = y, al = .9;
    if (hash(i, 5) < .05) {
      const tf = 45 + hash(i, 6) * 2.4, d = Math.max(0, t - tf);
      lx += Math.sin(d * 2.2 + i) * 22 * d; ly += d * d * 38; al *= 1 - prog(d, 1.2, 2.4);
    }
    g.globalAlpha = al;
    g.fillStyle = LEAF_COLS[(hash(i, 3) * LEAF_COLS.length) | 0];
    g.beginPath(); g.arc(lx, ly, 5.2 * b, 0, TAU); g.fill();
  });
  g.restore();
}

function sBuild(t) {
  const a = fade(t, 36, 48, .6, .8);
  if (a <= 0) return;
  const X = 100, Y = 110, PW = 860, PH = 570, sp = ease.outExpo(prog(t, 36, 37.2));

  g.save();
  g.globalAlpha = a * sp;
  g.translate(0, (1 - sp) * 30);
  g.shadowColor = 'rgba(90,60,30,.10)'; g.shadowBlur = 50; g.shadowOffsetY = 18;
  g.fillStyle = '#fbfaf6';
  g.beginPath(); g.roundRect(X, Y, PW, PH, 16); g.fill();
  g.shadowColor = 'transparent';
  g.strokeStyle = inkA(.08); g.lineWidth = 1; g.stroke();
  [C.clay, C.kraft, C.sage].forEach((c, k) => { g.fillStyle = c; g.beginPath(); g.arc(X + 30 + k * 20, Y + 28, 5.5, 0, TAU); g.fill(); });
  g.font = `400 15px ${MONO}`;
  g.fillStyle = C.mute; g.fillText('tree.js', X + 100, Y + 33);
  g.fillStyle = inkA(.06); g.fillRect(X, Y + 56, PW, 1);

  g.font = `400 20px ${MONO}`;
  const lh = 34, y0 = Y + 102;
  let rem = Math.floor(prog(t, 36.8, 42.4) * CODE_LEN), cx = X + 78, cy = y0;
  for (let li = 0; li < CODE.length && rem >= 0; li++) {
    const y = y0 + li * lh;
    g.textAlign = 'right'; g.fillStyle = inkA(.22); g.fillText(String(li + 1), X + 52, y); g.textAlign = 'left';
    let x = X + 78, left = Math.min(rem, CODE[li].length);
    for (const [s, col] of TOKENS[li]) {
      if (left <= 0) break;
      const part = s.slice(0, left);
      g.fillStyle = col; g.fillText(part, x, y);
      x += g.measureText(part).width; left -= s.length;
    }
    cx = x; cy = y;
    rem -= CODE[li].length + 1;
  }
  if (t < 42.4 || Math.floor(t / .55) % 2 === 0) { g.fillStyle = C.clay; g.fillRect(cx + 2, cy - 19, 2.5, 25); }
  const ok = prog(t, 42.7, 43.2);
  if (ok > 0) {
    g.globalAlpha = a * sp * ok;
    g.font = `400 15px ${MONO}`;
    g.fillStyle = C.sage; g.fillText('●', X + 78, Y + PH - 26);
    g.fillStyle = C.mute; g.fillText('1,023 branches · 1,024 leaves · 1 recursive function', X + 100, Y + PH - 26);
  }
  g.restore();

  g.save();
  g.globalAlpha = a;
  drawTree(t, prog(t, 37.2, 42.6) * 10, t - 42.8);
  g.restore();
  title(t, 36.6, 47.2, 'v.', '我动手', '程序首先写给人读，其次才交给机器执行。');
}

/* ---------- VI · 一起 ---------- */
function sOutro(t) {
  if (t < 48) return;
  const breath = 1 + Math.sin(t * TAU / (BEAT * 4)) * .02;
  drawSpark(W / 2, 360, 150 * breath, (t - 48) * .06, k => ease.outBack(prog(t, 48.6 + k * .16, 49.2 + k * .16)));
  text('今天想一起做点什么？', W / 2, 660, { t, at: 50.6, size: 66, weight: 500, align: 'center' });
  if (t > 51.4 && Math.floor((t - 51.4) / .55) % 2 === 0) {
    g.save();
    g.font = `500 66px ${SERIF}`;
    g.fillStyle = C.clay;
    g.fillRect(W / 2 + g.measureText('今天想一起做点什么？').width / 2 + 14, 604, 4, 66);
    g.restore();
  }
  text('C L A U D E   ·   by Anthropic', W / 2, 744, { t, at: 51.4, size: 20, color: C.mute, align: 'center', ls: 2 });
  text('1 个 HTML 文件 · 0 素材 · 每一帧都是 render(t) · 音乐由 Web Audio 实时合成', W / 2, 860, { t, at: 52.4, size: 16, family: MONO, color: inkA(.4), align: 'center' });
}

/* ---------- paper & chrome ---------- */
const CHAPTERS = [[0, 'i.', '序'], [6, 'ii.', '你好'], [14, 'iii.', '思考'], [26, 'iv.', '坦诚'], [36, 'v.', '动手'], [48, 'vi.', '一起']];
const VIGNETTE = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), gr = x.createRadialGradient(W / 2, H * .45, H * .3, W / 2, H / 2, H * 1.05);
  gr.addColorStop(0, 'rgba(120,90,50,0)'); gr.addColorStop(1, 'rgba(120,90,50,.16)');
  x.fillStyle = gr; x.fillRect(0, 0, W, H);
  return c;
})();
const GRAIN = [0, 1, 2, 3].map(k => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), img = x.createImageData(256, 256), r = rng(100 + k);
  for (let i = 0; i < img.data.length; i += 4) { const v = 222 + r() * 33; img.data[i] = v; img.data[i + 1] = v - 2; img.data[i + 2] = v - 6; img.data[i + 3] = 255; }
  x.putImageData(img, 0, 0);
  return g.createPattern(c, 'repeat');
});

function chrome(t) {
  const a = fade(t, 6, 58.4, 1, 1);
  if (a <= 0) return;
  const ci = CHAPTERS.findLastIndex(c => t >= c[0]);
  g.save();
  g.globalAlpha = a;
  g.font = `italic 400 20px ${SERIF}`;
  g.fillStyle = inkA(.62); g.fillText('Claude, in sixty seconds', 80, 82);
  g.textAlign = 'right'; g.fillStyle = inkA(.45);
  g.fillText(`${CHAPTERS[ci][1]}  ${CHAPTERS[ci][2]}`, W - 80, 82);
  g.textAlign = 'center'; g.font = `italic 400 18px ${SERIF}`;
  g.fillText(`— ${ci + 1} —`, W / 2, H - 78);
  g.fillStyle = inkA(.1); g.fillRect(80, H - 52, W - 160, 1);
  g.fillStyle = C.clay; g.fillRect(80, H - 53, (W - 160) * clamp(t / DUR), 2);
  g.restore();
}

function render(t) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.fillStyle = C.paper; g.fillRect(0, 0, W, H);
  if (t >= 0) { sOpen(t); sHello(t); sThink(t); sHonest(t); sBuild(t); sOutro(t); }
  g.drawImage(VIGNETTE, 0, 0);
  g.save();
  g.globalCompositeOperation = 'multiply';
  g.fillStyle = GRAIN[Math.floor(Math.max(t, 0) * 12) % 4];
  g.translate((t * 997) % 256 - 256, (t * 613) % 256 - 256);
  g.fillRect(0, 0, W + 512, H + 512);
  g.restore();
  chrome(t);
  const out = prog(t, 59.2, 60);
  if (out > 0) { g.fillStyle = `rgba(243,240,232,${out})`; g.fillRect(0, 0, W, H); }
}

/* ---------- score: a felt-piano miniature in D major, 72 BPM ---------- */
const CHORDS = [
  { root: 50, pad: [62, 66, 69, 73, 76] },   // Dmaj9
  { root: 47, pad: [59, 62, 66, 69, 73] },   // Bm9
  { root: 43, pad: [55, 59, 62, 66, 69] },   // Gmaj9
  { root: 45, pad: [57, 61, 64, 66, 71] },   // A6/9
];
const PENTA = [62, 64, 66, 69, 71, 74, 76, 78, 81, 83, 86, 88];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

function score(ctx, out, t0) {
  const sr = ctx.sampleRate, CH = BEAT * 8, T = x => t0 + x;
  const master = ctx.createGain(); master.connect(out);
  master.gain.setValueAtTime(0, t0); master.gain.linearRampToValueAtTime(.9, t0 + .3);
  master.gain.setValueAtTime(.9, t0 + 57.8); master.gain.linearRampToValueAtTime(0, t0 + 60.3);
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 2.5; comp.connect(master);

  const ir = ctx.createBuffer(2, sr * 5, sr);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.6); }
  const verb = ctx.createConvolver(); verb.buffer = ir;
  const wet = ctx.createGain(); wet.gain.value = .55; verb.connect(wet).connect(comp);
  const send = ctx.createGain(); send.connect(comp); send.connect(verb);
  const echo = ctx.createDelay(2); echo.delayTime.value = BEAT * .75;
  const fb = ctx.createGain(); fb.gain.value = .3;
  const elp = ctx.createBiquadFilter(); elp.frequency.value = 2200;
  echo.connect(elp).connect(fb).connect(echo); elp.connect(send);
  const white = ctx.createBuffer(1, sr * 2, sr);
  { const d = white.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }

  const adsr = (v, at, peak, a, hold, r) => {
    v.gain.setValueAtTime(0, at); v.gain.linearRampToValueAtTime(peak, at + a);
    v.gain.setValueAtTime(peak, at + a + hold); v.gain.exponentialRampToValueAtTime(1e-4, at + a + hold + r);
  };
  const vca = (...dests) => { const v = ctx.createGain(); v.gain.value = 0; dests.forEach(d => v.connect(d)); return v; };
  const osc = (type, f, at, end, dest, det = 0) => {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det;
    o.connect(dest); o.start(at); o.stop(end);
  };
  const piano = (at, m, vel, ...dests) => {
    const f = mtof(m), life = clamp(3 - (m - 60) * .05, .9, 3.2);
    [[1, 1, 1], [2, .38, .5], [3, .14, .3], [4.02, .05, .18]].forEach(([mul, gn, dk]) => {
      const v = vca(...(dests.length ? dests : [send]));
      adsr(v, at, vel * gn * .15, .005, 0, life * dk);
      osc('sine', f * mul, at, at + life * dk + .1, v, mul === 1 ? 0 : 3);
    });
  };
  const breath = (at, len, gain) => {
    const s = ctx.createBufferSource(); s.buffer = white;
    const bq = ctx.createBiquadFilter(); bq.type = 'lowpass'; bq.Q.value = .4;
    bq.frequency.setValueAtTime(200, at); bq.frequency.linearRampToValueAtTime(1600, at + len * .6); bq.frequency.linearRampToValueAtTime(300, at + len);
    const v = vca(send); adsr(v, at, gain, len * .6, 0, len * .4);
    s.connect(bq).connect(v); s.start(at); s.stop(at + len + .1);
  };

  { const v = vca(send); v.gain.setValueAtTime(0, T(0)); v.gain.linearRampToValueAtTime(.05, T(5)); v.gain.exponentialRampToValueAtTime(1e-4, T(8));
    osc('sine', mtof(50), T(0), T(8.2), v); osc('sine', mtof(57), T(0), T(8.2), v, 3); }
  PENTA.forEach((m, k) => piano(T(RAY_T(k) + .05), m, .55 - k * .015, send, echo));

  for (let k = 0; ; k++) {
    const at = 6 + k * CH;
    if (at > 58) break;
    const ch = CHORDS[k % 4], s = T(at), end = s + CH + 3.2;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = .5;
    lp.frequency.setValueAtTime(600, s); lp.frequency.linearRampToValueAtTime(at >= 36 && at < 48 ? 1600 : 1200, s + CH * .5); lp.frequency.linearRampToValueAtTime(700, end);
    const v = vca(send); lp.connect(v); adsr(v, s, .05, 2.2, CH - 2.2, 3);
    ch.pad.forEach(n => { osc('triangle', mtof(n), s, end, lp, -5); osc('triangle', mtof(n), s, end, lp, 5); });
    const bv = vca(comp); adsr(bv, s, .12, .6, CH - .6, 1.4);
    osc('sine', mtof(ch.root), s, s + CH + 2.2, bv);
  }

  const PAT = [0, 2, 1, 3, 2, 4, 3, 1];
  const arp = (from, to, step, shift, vel) => {
    for (let i = 0; ; i++) {
      const at = from + i * step;
      if (at >= to - 1e-6) break;
      const ch = CHORDS[Math.floor((at - 6) / CH + 1e-6) % 4];
      piano(T(at), ch.pad[PAT[i % 8]] + shift, i % 8 === 0 ? vel * 1.25 : vel, send, echo);
    }
  };
  arp(14, 26, BEAT, 0, .34);
  arp(26, 36, BEAT * 2, 0, .3);
  arp(36, 48, BEAT / 2, 12, .24);
  breath(T(12.8), 2, .07); breath(T(47), 2.2, .07);

  PENTA.forEach((m, k) => piano(T(48.6 + k * .16 + .05), m, .4, send, echo));
  [38, 50, 57, 62, 66, 69, 73, 76].forEach((m, k) => piano(T(57.4 + k * .08), m, .5));
}

/* ---------- player ---------- */
const ui = document.getElementById('ui');
let ctx = null, rec = null;

function start(record) {
  ui.classList.add('hide');
  if (ctx) ctx.close();
  ctx = new AudioContext();
  const out = ctx.createGain(); out.connect(ctx.destination);
  rec = null;
  if (record) {
    const md = ctx.createMediaStreamDestination(); out.connect(md);
    const stream = new MediaStream([...cv.captureStream(FPS).getVideoTracks(), ...md.stream.getAudioTracks()]);
    const mimeType = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
    const chunks = [];
    rec = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 16e6 });
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
      a.download = 'claude-intro.webm';
      a.click();
    };
    rec.start();
  }
  const t0 = ctx.currentTime + .2;
  score(ctx, out, t0);
  const loop = () => {
    const t = ctx.currentTime - t0;
    render(t);
    if (t < DUR + .3) return requestAnimationFrame(loop);
    rec?.stop();
    document.getElementById('play').textContent = '再看一遍';
    ui.classList.remove('hide');
  };
  loop();
}

document.getElementById('play').onclick = () => start(false);
document.getElementById('rec').onclick = () => start(true);
addEventListener('keydown', e => {
  if (e.code === 'KeyF') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  if (e.code === 'Space' && ctx && !rec) { e.preventDefault(); ctx.state === 'running' ? ctx.suspend() : ctx.resume(); }
});

const still = location.hash.match(/t=([\d.]+)/);
if (still) { ui.classList.add('hide'); render(+still[1]); }
else render(10.6);
</script>
